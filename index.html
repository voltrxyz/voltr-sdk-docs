<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voltr Vault SDK Docs</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111;
        --muted: #666;
        --bg: #fff;
        --card: #f6f6f7;
        --border: #e3e3e6;
        --accent: #4338ca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f5f5f5;
          --muted: #a1a1aa;
          --bg: #0b0b0d;
          --card: #161618;
          --border: #2a2a2e;
          --accent: #a5b4fc;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 2rem;
        letter-spacing: -0.01em;
      }
      p.lede {
        margin: 0 0 2rem;
        color: var(--muted);
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 540px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      a.card {
        display: block;
        padding: 1.25rem 1.25rem 1.5rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        transition:
          border-color 120ms ease,
          transform 120ms ease;
      }
      a.card:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      a.card h2 {
        margin: 0 0 0.25rem;
        font-size: 1.1rem;
      }
      a.card p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      footer {
        margin-top: 3rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Voltr Vault SDK</h1>
      <p class="lede">API reference for the Voltr Vault program clients.</p>
      <div class="grid">
        <a class="card" href="./js/">
          <h2>JavaScript / TypeScript</h2>
          <p>@voltr/vault-sdk &mdash; generated with TypeDoc</p>
        </a>
        <a class="card" href="./rust/voltr_vault_client/index.html">
          <h2>Rust</h2>
          <p>voltr-vault-client &mdash; generated with rustdoc</p>
        </a>
      </div>
      <footer>
        Source:
        <a href="https://github.com/voltrxyz/vault-program">voltrxyz/vault-program</a>
      </footer>
    </main>
  </body>
</html>
