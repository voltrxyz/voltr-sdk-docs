name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create index page
        run: |
          cat > index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Voltr SDK Documentation</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; }
              a { color: #0066cc; text-decoration: none; }
              a:hover { text-decoration: underline; }
              h1 { border-bottom: 1px solid #eee; padding-bottom: 12px; }
              li { margin: 8px 0; }
            </style>
          </head>
          <body>
            <h1>Voltr SDK Documentation</h1>
            <ul>
              <li><a href="./js/">TypeScript SDK (@voltr/vault-sdk)</a></li>
              <li><a href="./rust/voltr_vault/">Rust — voltr-vault</a></li>
              <li><a href="./rust/voltr_basic_adaptor/">Rust — voltr-basic-adaptor</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
